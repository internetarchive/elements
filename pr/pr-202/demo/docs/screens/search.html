<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Search Results — Internet Archive Elements screens</title>
<style>body { margin: 0; }</style>
  <script type="module" crossorigin src="../../../assets/demo/docs/screens/search-hyyqD5uL.js"></script>
  <link rel="modulepreload" crossorigin href="../../../assets/site-ChfTGo1o.js">
  <link rel="stylesheet" crossorigin href="../../../assets/site-DpP_Qwic.css">
  <link rel="stylesheet" crossorigin href="../../../assets/ia-BIkYrQ9h.css">
</head>
<body class="ia-page">
<a class="ia-skip-link" href="#maincontent">Skip to Main Content</a>
<header class="ia-topnav ia-inverse" id="topnav"></header>

<main id="maincontent" tabindex="-1">
  <div class="ia-search-band">
    <div class="ia-search-band__inner">
      <h1 class="ia-search-band__title ia-type-page-title">Search</h1>
      <div class="ia-search-band__bar" id="search-bar"></div>
      <div class="ia-search-band__links"><a class="ia-link" href="#maincontent">Advanced Search</a></div>
      <div class="ia-search-band__actions">
        <button class="ia-button ia-button--sm ia-button--ghost" type="button" data-icon-before="share" data-icon-size="sm">Share</button>
      </div>
    </div>
  </div>

  <div class="ia-shell">
    <div id="search-type"></div>

    <div class="ia-facets" role="tabpanel" id="results-panel" aria-labelledby="st-0" style="margin-block-start:var(--ia-space-4)">
      <div class="ia-facets__layout">
        <aside class="ia-facet-rail" aria-label="Filters" id="rail"></aside>
        <div class="ia-facets__results">
          <section class="ia-suggestions" aria-labelledby="suggestions-title">
            <div class="ia-carousel">
              <div class="ia-carousel__header">
                <h2 class="ia-type-section" id="suggestions-title" style="margin:0">Look Inside</h2>
                <div class="ia-carousel__controls">
                  <button class="ia-button ia-button--ghost ia-button--icon ia-button--sm" type="button" data-carousel="prev" aria-label="Previous Page" data-icon="chevron-left"></button>
                  <button class="ia-button ia-button--ghost ia-button--icon ia-button--sm" type="button" data-carousel="next" aria-label="Next Page" data-icon="chevron-right"></button>
                </div>
              </div>
              <ul class="ia-carousel__viewport" id="suggestions" tabindex="0" aria-label="Look Inside, scrollable"></ul>
            </div>
          </section>
          <h2 class="ia-results-heading" aria-live="polite"><span class="ia-results-heading__scope" id="scope">All</span>1,228 Results</h2>
          <div id="sort-bar"></div>
          <div class="ia-tile-grid" id="results" style="margin-block-start:var(--ia-space-4)"></div>
        </div>
      </div>
    </div>
  </div>
</main>

</body>
</html>
