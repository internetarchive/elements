# Publish to npm whenever a release/prerelease is published
name: Publish release to npm
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Browsers
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            echo "Playwright install attempt $attempt"
            if timeout --signal=KILL 150 npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Attempt $attempt stalled or failed; retrying..."
          done
          echo "Playwright install failed after 3 attempts" >&2
          exit 1
      - run: npm test
      - run: |
          if ${{ github.event.release.prerelease }}; then
            npm publish --provenance --tag alpha
          else
            npm publish --provenance
          fi
