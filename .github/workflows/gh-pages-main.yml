# This workflow will generate the static page under `main` subdirectory inside the `ghpages` branch

# This workflow will run every time new changes were pushed to the `main` branch

name: App build CI/CD to main branch
permissions:
  contents: write

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - name: Set up Node 🟢
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Git
        run: |
          git config --global user.name "Github Actions"
          git config --global user.email "actions@github.com"

      - name: Install and Build 🔧
        run: |
          pnpm install --frozen-lockfile
          pnpm run ghpages:build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: ghpages
          folder: ghpages
          clean-exclude: pr/
          force: false
