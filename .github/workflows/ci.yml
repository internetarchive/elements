name: App CI

on:
  push:
    branches: [ main ]
  # Deliberately unfiltered. A branch filter here matches the PR's base, not
  # its head, so filtering on main skips every PR in a stack, where each one
  # is based on the PR below it rather than on main.
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Lint
      run: pnpm run lint

  # Its own job so a type error is reported as one, rather than surfacing under
  # lint or tests. Neither of those checks types: vitest transpiles without
  # checking, and eslint isn't type-aware here, so without this a type error
  # reaches `pnpm build` at publish time.
  typecheck:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Typecheck
      run: pnpm run typecheck

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Install Playwright Browsers
      run: pnpm exec playwright install --with-deps chromium
      timeout-minutes: 6

    - name: Run tests
      run: pnpm run test

    - uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
